services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: book_agent
      POSTGRES_USER: book_agent
      POSTGRES_PASSWORD: book_agent_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U book_agent -d book_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://book_agent:book_agent_password@postgres:5432/book_agent?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NODE_ENV: production
      ADMIN_USER: admin
      ADMIN_PASSWORD: change-me
    ports:
      - "3000:3000"

volumes:
  postgres_data:

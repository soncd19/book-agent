services:
  - type: web
    name: book-agent-web
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: book-agent-db
          property: connectionString

databases:
  - name: book-agent-db
    plan: starter
    databaseName: book_agent
    user: book_agent
